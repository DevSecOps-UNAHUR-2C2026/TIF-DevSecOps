name: CI/CD Pipeline - Notes App DevSecOps con DefectDojo (4 Fases)

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-portfolio
  HELM_RELEASE_NAME: mi-app
  K8S_NAMESPACE: devops-portfolio
  DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
  DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_API_KEY }}
  PRODUCT_NAME: "Notes App"

jobs:
  # =========================================================================
  # FASE 1: BUILD & PACKAGE
  # =========================================================================
  build-and-package:
    name: "Fase 1: Build & Package (Imagen Inmutable)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar imagen Docker
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ./backend

      - name: Exportar imagen a tarball efímero
        run: |
          mkdir -p build-artifacts
          docker save ${{ env.DOCKER_IMAGE }}:${{ github.sha }} -o build-artifacts/app-image.tar

      - name: Publicar Artefacto de Imagen
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts/app-image.tar
          retention-days: 1

  # =========================================================================
  # FASE 2: AUDITORÍAS DE CIBERSEGURIDAD Y GENERACIÓN DE REPORTES
  # =========================================================================
  security-audits:
    name: "Fase 2: Auditorías (SAST, SCA, IaC y Secretos)"
    runs-on: ubuntu-latest
    needs: [build-and-package]
    steps:
      - name: Checkout del código (Historial completo para Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear carpeta para reportes
        run: mkdir -p reports-json

      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts

      - name: Cargar imagen Docker compilada
        run: |
          docker load -i build-artifacts/app-image.tar

      - name: Instalar Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Renderizar Helm Chart (TP10B - Pattern)
        run: |
          helm template ${{ env.HELM_RELEASE_NAME }} ./devops-portfolio -f devops-portfolio/values-prod.yaml > manifests-rendered-prod.yaml

      # -------------------------------------------------------------
      # 2A. THREAGILE THREAT MODELING
      # -------------------------------------------------------------
      - name: Ejecutar Threagile Threat Model Analysis
        uses: threagile/run-threagile-action@v1
        with:
          model-file: 'threagile.yaml'
          output-dir: 'reports-json'
        continue-on-error: true

      # -------------------------------------------------------------
      # 2B. SEMGREP SAST
      # -------------------------------------------------------------
      - name: Ejecutar Semgrep SAST
        run: |
          python3 -m pip install semgrep
          semgrep scan --config=p/owasp-top-10 --config=p/python --config=p/dockerfile --json -o reports-json/semgrep-results.json || true

      # -------------------------------------------------------------
      # 2C. TRIVY CONTAINER & SCA
      # -------------------------------------------------------------
      - name: Ejecutar Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.sha }}'
          format: 'json'
          output: 'reports-json/trivy-container-results.json'
          exit-code: '0'

      # -------------------------------------------------------------
      # 2D. GITLEAKS SECRET SCANNING
      # -------------------------------------------------------------
      - name: Ejecutar Gitleaks CLI
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --source . --report-format json --report-path reports-json/gitleaks-report.json || true

      # -------------------------------------------------------------
      # 2E. HADOLINT - DOCKERFILE LINTING
      # -------------------------------------------------------------
      - name: Ejecutar Hadolint
        run: |
          docker run --rm -i hadolint/hadolint hadolint -f json - < ./backend/Dockerfile > reports-json/hadolint.json || true

      # -------------------------------------------------------------
      # 2F. CHECKOV - IAC Y CONFIGURACIONES
      # -------------------------------------------------------------
      - name: Ejecutar Checkov
        run: |
          pipx install checkov
          checkov -d ./backend --framework dockerfile -o json > reports-json/checkov.json || true

      # -------------------------------------------------------------
      # 2G. SYFT - GENERACIÓN DE SBOM
      # -------------------------------------------------------------
      - name: Generar SBOM con Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          syft docker:${{ env.DOCKER_IMAGE }}:${{ github.sha }} -o cyclonedx-json=reports-json/sbom.json

      # -------------------------------------------------------------
      # Publicar Artefactos
      # -------------------------------------------------------------
      - name: Publicar Artefacto de Reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-json-reports
          path: reports-json/
          retention-days: 1

  # =========================================================================
  # FASE 3: CENTRALIZACIÓN Y DEDUPLICACIÓN EN OWASP DEFECTDOJO
  # =========================================================================
  defectdojo-import:
    name: "Fase 3: Centralización en DefectDojo (Vulnerability Management)"
    runs-on: ubuntu-latest
    needs: [security-audits]
    if: always()
    steps:
      - name: Descargar Reportes JSON
        uses: actions/download-artifact@v4
        with:
          name: security-json-reports
          path: reports-json

      - name: Importar Threagile Threat Model a DefectDojo
        run: |
          curl -i -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
            -H "ngrok-skip-browser-warning: true" \
            -F "product_name=${{ env.PRODUCT_NAME }}" \
            -F "scan_type=Generic Findings Import" \
            -F "engagement_name=CI/CD Automated Security Audits" \
            -F "auto_create_context=true" \
            -F "file=@reports-json/threagile-results.json"

      - name: Importar Semgrep a DefectDojo
        run: |
          curl -i -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
            -H "ngrok-skip-browser-warning: true" \
            -F "product_name=${{ env.PRODUCT_NAME }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "engagement_name=CI/CD Automated Security Audits" \
            -F "auto_create_context=true" \
            -F "file=@reports-json/semgrep-results.json"

      - name: Importar Trivy a DefectDojo
        run: |
          curl -i -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
            -H "ngrok-skip-browser-warning: true" \
            -F "product_name=${{ env.PRODUCT_NAME }}" \
            -F "scan_type=Trivy Scan" \
            -F "engagement_name=CI/CD Automated Security Audits" \
            -F "auto_create_context=true" \
            -F "file=@reports-json/trivy-container-results.json"

      - name: Importar Gitleaks a DefectDojo
        run: |
          curl -i -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
            -H "ngrok-skip-browser-warning: true" \
            -F "product_name=${{ env.PRODUCT_NAME }}" \
            -F "scan_type=Gitleaks Scan" \
            -F "engagement_name=CI/CD Automated Security Audits" \
            -F "auto_create_context=true" \
            -F "file=@reports-json/gitleaks-report.json"

      - name: Importar OWASP ZAP a DefectDojo
        run: |
          curl -i -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
            -H "ngrok-skip-browser-warning: true" \
            -F "product_name=${{ env.PRODUCT_NAME }}" \
            -F "scan_type=ZAP Scan" \
            -F "engagement_name=CI/CD Automated Security Audits" \
            -F "auto_create_context=true" \
            -F "file=@reports-json/zap-results.xml"

      # -------------------------------------------------------------
      # Importación de Nuevas Herramientas (Hadolint, Checkov, Syft)
      # -------------------------------------------------------------
      - name: Importar Hadolint a DefectDojo
        run: |
          curl -i -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
            -H "ngrok-skip-browser-warning: true" \
            -F "product_name=${{ env.PRODUCT_NAME }}" \
            -F "scan_type=Hadolint Dockerfile check" \
            -F "engagement_name=CI/CD Automated Security Audits" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" \
            -F "file=@reports-json/hadolint.json"

      - name: Importar Checkov a DefectDojo
        run: |
          curl -i -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
            -H "ngrok-skip-browser-warning: true" \
            -F "product_name=${{ env.PRODUCT_NAME }}" \
            -F "scan_type=Checkov Scan" \
            -F "engagement_name=CI/CD Automated Security Audits" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" \
            -F "file=@reports-json/checkov.json"

      - name: Importar Syft (SBOM) a DefectDojo
        run: |
          curl -i -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
            -H "ngrok-skip-browser-warning: true" \
            -F "product_name=${{ env.PRODUCT_NAME }}" \
            -F "scan_type=CycloneDX Scan" \
            -F "engagement_name=CI/CD Automated Security Audits" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" \
            -F "file=@reports-json/sbom.json"

      - name: Resumen de Centralización en GitHub
        run: |
          echo "### Centralización de Vulnerabilidades en DefectDojo :shield:" >> $GITHUB_STEP_SUMMARY
          echo "Los reportes de ZAP, Threagile, Semgrep, Trivy, Gitleaks, Hadolint, Checkov y el SBOM de Syft han sido procesados y cargados exitosamente." >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # FASE 4: RELEASE & DEPLOY
  # =========================================================================
  deploy-k8s-helm:
    name: "Fase 4: Release & Deploy Helm K8s"
    runs-on: ubuntu-latest
    needs: [build-and-package, security-audits, defectdojo-import]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts

      - name: Cargar imagen Docker probada
        run: |
          docker load -i build-artifacts/app-image.tar

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar y Push a Docker Hub
        run: |
          docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

      # -------------------------------------------------------------
      # FIRMA CRIPTOGRÁFICA DE LA IMAGEN CON COSIGN
      # -------------------------------------------------------------
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Firmar imagen Docker con Cosign
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          echo "${COSIGN_PRIVATE_KEY}" > cosign.key
          cosign sign --key cosign.key -y ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cosign sign --key cosign.key -y ${{ env.DOCKER_IMAGE }}:latest

      - name: Despliegue con Helm en Kubernetes
        run: |
          echo "Desplegando Helm Chart en Kubernetes..."
